name: Termux ARM64 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-termux:
    name: Build Termux Native (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: |
            .cargo_cache
            .apt_cache
            target
          key: termux-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            termux-build-${{ runner.os }}-

      - name: Grant workspace permissions to container
        run: |
          mkdir -p .cargo_cache .apt_cache target
          chmod -R 777 "${{ github.workspace }}"

      - name: Build inside Termux Docker container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -v "${{ github.workspace }}/.apt_cache":/data/data/com.termux/files/usr/var/cache/apt/archives \
            -w /workspace \
            termux/termux-docker:aarch64 \
            bash -c "
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              export CARGO_HOME=/workspace/.cargo_cache
              PREFIX=/data/data/com.termux/files/usr
              
              echo 'Configuring high-speed European Tier-1 Termux mirrors...'
              mkdir -p \$PREFIX/etc/apt/sources.list.d
              echo 'deb https://mirror.accum.se/mirror/termux.dev/termux-main stable main' > \$PREFIX/etc/apt/sources.list
              
              apt-get update -y
              apt-get install -y --no-install-recommends x11-repo tur-repo
              
              echo 'deb https://mirror.accum.se/mirror/termux.dev/termux-x11 x11 main' > \$PREFIX/etc/apt/sources.list.d/x11.list
              apt-get update -y
              
              echo 'Installing build toolchain and dependencies from high-speed mirror...'
              apt-get install -y --no-install-recommends \
                rust clang cmake make binutils pkg-config \
                glib pango gdk-pixbuf libcairo gtk4 libadwaita \
                libx11 libxinerama libxi pulseaudio \
                vulkan-headers vulkan-loader-generic mesa
              
              echo 'Building cordial-runtime (cordial-run)...'
              cargo build --release -p cordial-runtime --bin cordial-run
              
              echo 'Building cordial-shell (cordial-shell)...'
              cargo build --release -p cordial-shell --bin cordial-shell
              
              echo 'Preparing release artifacts...'
              mkdir -p dist/termux
              cp target/release/cordial-run dist/termux/cordial-run
              cp target/release/cordial-shell dist/termux/cordial-shell
              
              # Strip binaries for release (debug symbols kept out of upload path)
              mkdir -p dist/debug
              objcopy --only-keep-debug dist/termux/cordial-run dist/debug/cordial-run.dbg 2>/dev/null || true
              strip --strip-unneeded dist/termux/cordial-run dist/termux/cordial-shell 2>/dev/null || true
              chmod -R 777 dist .cargo_cache .apt_cache target 2>/dev/null || true
            "

      - name: Ensure post-build cache permissions
        if: always()
        run: sudo chmod -R 777 .cargo_cache .apt_cache target dist 2>/dev/null || true

      - name: Upload Termux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: cordial-termux-aarch64
          path: dist/termux/
          if-no-files-found: error
