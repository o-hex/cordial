[workspace]
resolver = "2"
members = [
    "crates/cordial-linker-sys",
    "crates/cordial-runtime",
    "crates/cordial-plugins",
    "crates/cordial-shell",
    "crates/cordial-update",
]

[workspace.package]
version = "0.13.2"
edition = "2021"
license = "GPL-3.0-or-later"  # see LICENSE; third-party notices in THIRD-PARTY-NOTICES.md
rust-version = "1.75"

[profile.release]
debug = false     # Disabled on Android/Termux to prevent excessive UFS 4.1 flash wear and write amplification (reduces build artifacts from ~11.5 GB to ~350 MB)
strip = "symbols"

