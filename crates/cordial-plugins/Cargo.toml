[package]
name = "cordial-plugins"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zbus = { version = "5.18.0", features = ["blocking"] }
zstd = "0.13"
