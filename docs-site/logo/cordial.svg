<svg width="420" height="420" viewBox="130 30 420 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <!--
    The application icon, kept separate from ../../../io.github.luohoa97.Cordial.svg
    because that one is the README banner and is 680x480. flatpak-builder runs
    flatpak-validate-icon over everything it exports and refuses a non-square
    icon outright — "Expected a square icon but got: 680x480", and the export
    fails rather than warns, so the banner cannot double as the icon. Same
    artwork, same coordinates; only the viewBox differs, framed on the art's
    centre at (340, 240).

    The path mirrors where it lands in the package, so the manifest's install
    line is a plain copy and there is nothing to get subtly wrong.
  -->
  <title>Cordial</title>
  <desc>A rotated square with rounded corners, cut into two halves by a thin bar shaped gap that runs the full width and expands into a rounded square at the centre, filled with a raspberry to orange to lime gradient.</desc>
  <defs>
    <linearGradient id="cordial5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1B6B"/>
      <stop offset="45%" stop-color="#FF7A18"/>
      <stop offset="100%" stop-color="#B4E600"/>
    </linearGradient>
    <linearGradient id="sheen5" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="outer5">
      <rect x="190" y="90" width="300" height="300" rx="40" ry="40" transform="rotate(13 340 240)"/>
    </clipPath>
    <mask id="cut5">
      <rect x="140" y="40" width="400" height="400" fill="#fff"/>
      <rect x="150" y="228" width="380" height="24" fill="#000" transform="rotate(13 340 240)"/>
      <rect x="290" y="190" width="100" height="100" rx="18" ry="18" fill="#000" transform="rotate(13 340 240)"/>
    </mask>
  </defs>
  <g clip-path="url(#outer5)" mask="url(#cut5)">
    <rect x="140" y="40" width="400" height="400" fill="url(#cordial5)"/>
    <rect x="140" y="40" width="400" height="400" fill="url(#sheen5)"/>
  </g>
</svg>
